[build]
  publish = "."

# The service worker script must always be revalidated, otherwise a stale
# worker can keep serving an old application shell.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# The manifest changes with every release (name, icons, colours) and must not
# be held for an hour in a browser or a service worker cache.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Self-hosted fonts are stable files and are safe to cache for a week.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self)"
