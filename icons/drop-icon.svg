<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Drop">
  <!--
    Drop — standard launcher icon.
    Square canvas, full-bleed background (no pre-rounded corners).
    iOS applies its own mask, Android applies its adaptive mask.
    The symbol is a geometric "D" monogram with the "Drop." period.
  -->
  <rect width="512" height="512" fill="#DC2626"/>
  <g transform="translate(4 13) scale(4.5)" fill="#FFFFFF">
    <path fill-rule="evenodd" d="M18 16H50A30 34 0 0 1 50 84H18ZM38 34H48A12 16 0 0 1 48 66H38Z"/>
    <circle cx="86" cy="84" r="8"/>
  </g>
</svg>
